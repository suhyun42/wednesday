<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alicia · Hiring Manager Studio</title><meta name="description" content="Personal interview practice for B2B strategic finance."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23152746'/%3E%3Cpath d='M8 24 16 7 24 24M11 19h10' fill='none' stroke='%236fe2cb' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152746;background:#f1f4f9;font-size:16px;--navy:#152746;--muted:#53647b;--line:#d9e1ec;--accent:#126a61;--mint:#c9f7eb;--white:#fff}*{box-sizing:border-box}body{margin:0}button,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #188eaa;outline-offset:3px}button{border:1px solid var(--line);background:white;color:var(--navy);border-radius:9px;padding:10px 16px;min-height:44px;font-weight:600}button:hover:not(:disabled){background:#edf3f9}button.primary{background:var(--navy);border-color:var(--navy);color:white}button.primary:hover{background:#263e65}button.accent{background:var(--mint);border-color:#a0d9c9;color:#124c43}button.small{font-size:.875rem;padding:7px 11px}a{color:#116a75}header{background:var(--navy);color:white;padding:19px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:13px;align-items:center}.monogram{background:var(--mint);color:var(--navy);width:40px;height:40px;display:grid;place-items:center;border-radius:12px;font-weight:800;font-size:1.2rem}.brand strong{display:block;font-size:1.08rem}.brand small{color:#ccd7e8;font-size:.875rem}.nav{display:flex;gap:6px}.nav button{background:transparent;border-color:transparent;color:#d9e4f5}.nav button.active{background:#334762;color:white}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 83px)}aside{padding:25px 18px;border-right:1px solid var(--line);background:#f9fbfe}.side-label,.eyebrow{text-transform:uppercase;font-size:.75rem;letter-spacing:.1em;font-weight:750;color:var(--muted)}.side-label{margin:22px 10px 8px}.question-link{width:100%;text-align:left;display:flex;gap:11px;border:0;background:transparent;font-size:.9rem;font-weight:500;line-height:1.4;padding:12px 10px}.question-link.selected{background:#e0eaf7;color:#143659;font-weight:700}.qnum{font-variant-numeric:tabular-nums;color:#697991;font-size:.8rem;padding-top:2px}.question-link .dot{margin-left:auto;font-size:.8rem;color:var(--accent)}.side-foot{font-size:.82rem;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);margin-top:24px;padding:18px 10px}main{padding:32px 40px 64px;min-width:0}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.pill{background:#e4ecf8;color:#284668;border-radius:20px;padding:6px 12px;font-size:.8rem;font-weight:650}h1{font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.035em;line-height:1.2;margin:10px 0 17px;max-width:850px}h2{font-size:1.2rem;line-height:1.4;margin:0 0 12px}h3{font-size:1rem;line-height:1.4;margin:0 0 8px}p{line-height:1.7;margin:10px 0}.muted{color:var(--muted)}.intro{max-width:760px;font-size:1rem}.surface{background:white;border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:21px}.practice-top{display:flex;gap:22px;align-items:center;justify-content:space-between}.timer{font-size:2.4rem;font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:650;white-space:nowrap}.timer.expired{color:#a64720}.timer-label{font-size:.8rem;color:var(--muted)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.cues{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.cue{border-left:3px solid #39a78e;padding:4px 12px;font-size:.9rem;background:#f0faf6}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:25px;border-bottom:1px solid var(--line);padding-bottom:12px}.tabs button{border-color:transparent;background:transparent;color:var(--muted)}.tabs button.active{background:var(--navy);color:white}.answer-block{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid #edf1f6}.answer-block:last-child{border:0}.answer-block h3{font-size:.85rem;color:var(--accent);padding-top:6px}.answer-block p{margin:0;max-width:730px;line-height:1.8}.notice{border-left:3px solid #c28a23;background:#fff8e9;padding:13px 17px;margin-top:22px;font-size:.875rem;color:#654b22;line-height:1.65}.empty{padding:30px 0;text-align:center;color:var(--muted)}.empty h2{color:var(--navy)}.probe{font-size:1.3rem;line-height:1.5;font-weight:650;margin:18px 0}.probe-answer{padding:17px 20px;background:#edf6fa;border-radius:10px;margin:16px 0;line-height:1.8}.spaced{justify-content:space-between}.checklist{display:grid;gap:11px;margin:18px 0}.checklist label{display:flex;align-items:flex-start;gap:12px;line-height:1.6;padding:10px;background:#f6f8fc;border-radius:9px;cursor:pointer}.checklist input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex-shrink:0}textarea{width:100%;min-height:180px;resize:vertical;border:1px solid #acbad0;border-radius:10px;background:white;color:var(--navy);padding:15px;line-height:1.7;margin:10px 0}label.field{font-size:.9rem;font-weight:650}.save-note{font-size:.8rem;color:var(--muted)}.footer-nav{display:flex;justify-content:space-between;margin-top:24px;gap:12px}.progress{height:7px;background:#dbe5f1;border-radius:9px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#127b6b}.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.brief-grid .surface{margin-top:0}.brief-grid .full{grid-column:1/-1}ul,ol{padding-left:22px;line-height:1.8}li{margin:8px 0}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.65}th{color:var(--muted);font-weight:650}.table-wrap{overflow-x:auto}.phase-list{list-style:none;padding:0;display:flex;gap:8px;flex-wrap:wrap}.phase-list li{font-size:.8rem;padding:6px 10px;background:#e8edf5;border-radius:20px;margin:0}.phase-list .current{background:var(--navy);color:white}.select-mobile{display:none}#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:11px 20px;border-radius:10px;max-width:90%;box-shadow:0 3px 15px #0002}#status:empty{display:none}.actions-bottom{margin-top:20px}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

</style></head><body><div id="app"></div><div id="status" role="status" aria-live="polite"></div><script>
window.PREP = {
  "questions": [
    {
      "id": "intro",
      "group": "Your story",
      "title": "Walk me through your background.",
      "story": "Career narrative",
      "time": 90,
      "cues": [
        "B2B product economics",
        "A decision you own",
        "Why this next step"
      ],
      "tests": "Can you connect your experience to a strategic finance role without reciting your résumé?",
      "answer": [
        [
          "Position",
          "I’m a senior business planner at Microsoft, where I lead pricing, packaging, and product economics across Data and AI products. My work centers on how we grow consumption while protecting the economics of the business."
        ],
        [
          "Evidence",
          "For example, I helped develop a database savings plan, evaluated the cannibalization risk of launching SQL within Fabric, and modeled overage pricing to balance incremental usage with capacity upgrades. I build the business case and work with Product, Engineering, GTM, and Finance to turn that analysis into a recommendation."
        ],
        [
          "Background",
          "Before Microsoft, I worked in strategy and customer research, then earned my MBA at Cornell because I wanted to move closer to implementation and financial decisions."
        ],
        [
          "Connection",
          "This role is a natural extension of that experience. I bring an understanding of enterprise buying and consumption economics, and I want to deepen my ownership of demand forecasting, investment decisions, and ongoing product performance."
        ]
      ],
      "probes": [
        [
          "What do you personally own?",
          "I own the commercial analysis, scenario framing, and pricing or packaging recommendation. Product and Engineering contribute product behavior and feasibility; Finance partners contribute cost and business-health inputs. I synthesize those inputs into the decision. Use the exact ownership split for the example being discussed."
        ],
        [
          "How is this strategic finance experience?",
          "The output is a resource or commercial decision grounded in revenue, cost, and behavior. Explain how your analysis changed a launch, discount, investment, or prioritization decision—not simply that you set a price."
        ],
        [
          "Where would you need to ramp?",
          "My strongest experience is product economics and commercial decision support. I would need to learn the team's forecasting cadence, financial definitions, and compute-planning processes. I would bring an immediate understanding of the underlying consumption drivers."
        ]
      ],
      "watch": "Do not imply full P&L or corporate forecasting ownership unless you actually held it.",
      "checks": [
        "I stated my current scope.",
        "I gave concrete financial decisions.",
        "I distinguished my work from partner inputs.",
        "I connected my experience to the role."
      ]
    },
    {
      "id": "why",
      "group": "Your story",
      "title": "Why OpenAI, and why this role?",
      "story": "Motivation",
      "time": 75,
      "cues": [
        "Personal reason",
        "Relevant experience",
        "Financial responsibility"
      ],
      "tests": "Is your motivation specific, credible, and connected to the work?",
      "answer": [
        [
          "Personal connection",
          "Growing up with dyslexia made me aware of how much the right tools can change someone's ability to learn and participate. Visual tools helped me organize information, and that experience shaped my interest in making technology more accessible."
        ],
        [
          "Professional connection",
          "At Microsoft, I have worked on making complex cloud products easier to adopt and buy. That taught me that customer value and sustainable economics have to work together for a product to reach more people."
        ],
        [
          "Why the role",
          "B2B Strategic Finance connects the work I already do—usage economics, commitment structures, pricing, and launch decisions—with the financial responsibility I want to deepen. I’m excited by the opportunity to help translate demand for AI into decisions about growth, investment, and a sustainable business."
        ]
      ],
      "probes": [
        [
          "Why leave Microsoft now?",
          "I have built a strong foundation in cloud monetization. I’m looking for a role where I can extend that into broader product-finance ownership and work closely with a Bay Area team. Keep the answer forward-looking."
        ],
        [
          "What interests you beyond the mission?",
          "The business problem: understanding which customer behaviors create durable usage, what it costs to serve them, and which investments expand value sustainably. Connect that to your own commitment and capacity decisions."
        ],
        [
          "What would you bring immediately?",
          "A working understanding of enterprise commitments, usage-based pricing, discount leakage, and product cannibalization, plus experience getting Product, Engineering, GTM, and Finance aligned on a decision."
        ]
      ],
      "watch": "Explain your own motivation. Avoid speculating about internal OpenAI priorities or claiming product usage you have not described.",
      "checks": [
        "My motivation sounds personal.",
        "I connected it to B2B economics.",
        "I explained the specific work I want.",
        "I avoided generic praise."
      ]
    },
    {
      "id": "savings",
      "group": "Core examples",
      "title": "Tell me about a decision balancing growth and economics.",
      "story": "Database Savings Plan",
      "time": 90,
      "cues": [
        "Discount leakage vs retention",
        "$100M / two years",
        "250 planned → 400 observed"
      ],
      "tests": "Can you distinguish adoption, committed value, and genuinely incremental economics?",
      "answer": [
        [
          "Decision",
          "I helped develop a database savings plan across a portfolio exceeding $20 billion. The decision was how to offer flexibility and commitment discounts while protecting revenue from customers who would otherwise have stayed on pay-as-you-go."
        ],
        [
          "Analysis",
          "I evaluated enrollment, expected customer spend, realized pricing, and migration between commercial offers. The central tradeoff was discounted existing usage versus new or retained workloads. Our revised base forecast was approximately $100 million over two years, with scenarios roughly 20–30% above or below it."
        ],
        [
          "Recommendation",
          "I worked on product scope and a simpler sales motion. I initially advocated including Fabric, but revised that recommendation when the economics and commerce complexity did not support it. SQL licensing remained in the final scope."
        ],
        [
          "Outcome",
          "Observed enrollment is approximately 400 customers monthly versus 250 in the base assumption. That is encouraging, but I would evaluate incremental consumption, retention, and signups separately. More enrollments do not automatically mean a proportional increase in incremental revenue."
        ]
      ],
      "probes": [
        [
          "Isn't this just discounting customers who would have stayed?",
          "That is the principal financial downside. Compare expected revenue with the offer against the no-offer baseline, separating existing PAYG migration, new workloads, retained at-risk usage, and switching from reservations. PAYG billing above a commitment protects the price of excess usage; it does not recover the discount on covered usage."
        ],
        [
          "Enrollment is 60% above plan. Why not raise your revenue forecast 60%?",
          "400 divided by 250 is 1.6, but enrollment is only one driver. I would check commitment size, customer mix, enrollment timing, usage beyond commitment, and whether launch demand persists. More small customers or more existing PAYG migrations can produce less incremental revenue than fewer new, larger workloads."
        ],
        [
          "How do you justify equal discounts for one and three years?",
          "Longer price predictability and flexibility can have customer value even without a deeper discount. Eighteen early three-year enrollments demonstrated some demand at those terms. That does not prove the terms maximize value; I would examine term mix, spend, retention, and the cost of locking pricing for longer."
        ],
        [
          "Your résumé says $14M incremental revenue. What exactly is that?",
          "Your notes mix revenue through the offer with contract value, so the metric definition remains unresolved. If asked, state the verified reporting definition and period. Do not claim all purchases are incremental relative to the no-offer baseline. Practice explaining the distinction before using the résumé figure."
        ]
      ],
      "watch": "$100M is the latest working two-year forecast supplied for prep. Confirm whether it denotes incremental revenue. The ±20–30% ranges are working sensitivities, not independently validated historical model outputs. $20B is portfolio scale, not necessarily eligible spend.",
      "checks": [
        "I identified PAYG leakage.",
        "I explained the no-offer baseline.",
        "I separated forecast from observed adoption.",
        "I stated my own recommendation."
      ]
    },
    {
      "id": "fabric",
      "group": "Core examples",
      "title": "Walk me through a model that influenced a launch.",
      "story": "Fabric SQL",
      "time": 90,
      "cues": [
        "Protect a $5B business",
        "Spare capacity absorbs SQL",
        "Integration earns adoption"
      ],
      "tests": "Do you understand cannibalization, marginal billing, and the economics of an integrated product?",
      "answer": [
        [
          "Decision",
          "For Fabric SQL, I evaluated how to launch an integrated database while protecting an approximately $5 billion Azure SQL business. The risk was that existing SQL workloads could move into unused Fabric capacity without generating enough additional revenue to replace the PaaS revenue lost."
        ],
        [
          "Analysis",
          "I compared the existing PaaS model, integration into Fabric capacity, and a separate database-capacity approach. I examined overlapping workloads and utilization sensitivities. For comparable modeled workloads, Fabric was about 30% more expensive, but spare capacity could still make a customer's immediate additional bill small."
        ],
        [
          "Recommendation",
          "I recommended the existing Fabric capacity model and a focus on Fabric-native developers. The rationale was integration and purchasing simplicity, while evaluating whether incremental Fabric growth could offset the remaining compression risk."
        ],
        [
          "Outcome",
          "The product launched within the Fabric model. Usage has been lower than expected as enterprise capabilities develop. That limits near-term cannibalization, but it also means the incremental growth thesis still needs to be demonstrated."
        ]
      ],
      "probes": [
        [
          "How can a more expensive product cannibalize SQL?",
          "Distinguish the modeled cost allocated to the workload from the change in the customer's total bill. A customer who has already purchased spare Fabric capacity may absorb SQL without buying more capacity, while stopping a separate Azure SQL bill. That is why a 30% modeled premium alone is insufficient protection."
        ],
        [
          "What would your model look like?",
          "Suggested explanation to adapt to the model you actually built: identify overlapping workloads, estimate migration by segment, calculate displaced PaaS revenue, then estimate additional Fabric spend and attached workload revenue. Translate revenue changes to contribution using the relevant costs. Avoid presenting this suggested structure as confirmed implementation."
        ],
        [
          "What happened to the $170M risk figure?",
          "The notes describe approximately $170M in year-one risk at a utilization scenario, but its baseline and gross-versus-net definition are unresolved. Keep it out of the main answer. The $10M-per-utilization-point relationship cannot be linked to 35% without the original baseline or model detail."
        ],
        [
          "If adoption is weak, was your recommendation wrong?",
          "The recommendation could be sound on cannibalization protection and still miss the growth objective. I would diagnose enterprise-readiness gaps, activation, and workload fit, then update adoption and investment assumptions. Lower cannibalization alone is not a successful growth outcome."
        ]
      ],
      "watch": "Do not replace uncertain figures with invented numbers. The 30% premium is workload-specific. Do not attribute Fabric's overall 50% growth to SQL pricing, or convert fiscal-year revenue points into growth points without the original denominator.",
      "checks": [
        "I distinguished total portfolio from exposed workloads.",
        "I explained spare-capacity risk.",
        "I connected the analysis to the choice.",
        "I discussed the outcome candidly."
      ]
    },
    {
      "id": "overage",
      "group": "Core examples",
      "title": "How did you decide what to charge?",
      "story": "Fabric overage",
      "time": 90,
      "cues": [
        "Temporary spikes",
        "Upgrade economics",
        "3× / $50M forecast"
      ],
      "tests": "Can you explain how price changes behavior and distinguish billings from incremental value?",
      "answer": [
        [
          "Decision",
          "For Fabric overage, I evaluated how to support temporary usage spikes while preserving the incentive to upgrade capacity for sustained growth."
        ],
        [
          "Analysis",
          "I compared customer cost under overage, a larger capacity purchase, and a competitor offering. I separated reserved and on-demand customers because their realized prices changed the economics. In the reserved-capacity scenario I modeled, upgrading became preferable at around 20% sustained overage."
        ],
        [
          "Recommendation",
          "We recommended a three-times premium. It preserved an upgrade incentive while offering a lower multiplier than the four-times Power BI autoscale reference, which mattered for customers moving from that experience."
        ],
        [
          "Financial implication",
          "The base forecast was approximately $50 million annually at 10% adoption. I treat that as a modeled opportunity. I would separately evaluate displaced upgrades and incremental serving costs to determine how much additional contribution the offer creates."
        ]
      ],
      "probes": [
        [
          "Why 3× rather than 2× or 4×?",
          "The actual comparison supported an upgrade incentive and a transition from the Power BI reference. To establish an optimum, I would compare adoption, excess usage, contribution, and upgrade substitution across prices. Do not claim you tested every price if you did not."
        ],
        [
          "Show me why the upgrade threshold is about 20%.",
          "An illustrative check: let list capacity cost be P, RI cost be 0.595P, and overage cost be 3P times excess fraction x. If the next RI tier costs 1.19P, equality is 0.595P + 3Px = 1.19P, giving x about 19.8%. This assumes the next tier doubles, the same period and discount, and overage priced on list rates; confirm those assumptions match your actual model."
        ],
        [
          "Is the $50M all incremental?",
          "Not automatically. Net revenue impact equals overage revenue plus any retained or new spend attributable to the offer, minus revenue from upgrades that would otherwise have occurred. Contribution also subtracts incremental serving costs. Be explicit about what the original $50M forecast included."
        ],
        [
          "What would you monitor after launch?",
          "Suggested monitoring plan: adoption, excess usage per adopter, frequency of overage, upgrades, customer complaints, retained workloads, and contribution. Repeated sustained overage would prompt an upgrade recommendation. Launch status and realized results are not yet confirmed in your notes."
        ]
      ],
      "watch": "$50M is a forecast. The previous $25M–$75M range was illustrative, not a confirmed scenario model. Competitive 34%/41% thresholds depend on matched configurations and discount assumptions; keep them in reserve.",
      "checks": [
        "I explained the behavioral goal.",
        "I used realized pricing.",
        "I distinguished spikes from sustained demand.",
        "I accounted for displaced upgrades."
      ]
    },
    {
      "id": "ri",
      "group": "Core examples",
      "title": "Tell me about an investment you recommended deprioritizing.",
      "story": "OneLake reserved commitments",
      "time": 90,
      "cues": [
        "$21M annual opportunity",
        "Five customer migrations",
        "Relative priority"
      ],
      "tests": "Can you say no to a positive opportunity and recognize concentration and attribution risk?",
      "answer": [
        [
          "Decision",
          "I evaluated a reserved commitment offer for OneLake. The question was whether the potential adoption and data growth justified discounting existing consumption and using limited implementation capacity."
        ],
        [
          "Analysis",
          "The base opportunity was approximately $21 million in projected annual revenue after discounts. A key input was new enterprise data migration, including five large customers. I also observed a relationship between storage and Fabric capacity usage, which suggested potential adjacent revenue."
        ],
        [
          "Recommendation",
          "The economics looked promising, but the opportunity was relatively small against the company's prioritization threshold and other initiatives. We aligned on deprioritizing it at that time."
        ],
        [
          "Uncertainty",
          "The upside depended on customers actually migrating the data they described. I would keep that dependency explicit and validate migration timing and volumes before treating the revenue as secured. The storage-compute relationship was supporting evidence, not proof that every additional unit of storage would cause more compute consumption."
        ]
      ],
      "probes": [
        [
          "Why say no if the economics are positive?",
          "A positive opportunity still competes for scarce commerce and engineering capacity. Compare risk-adjusted contribution, time to value, delivery effort, and strategic importance with the next-best project. I was told larger opportunities were being prioritized. Do not invent engineering cost estimates you did not have."
        ],
        [
          "What if only two of the five customers migrate?",
          "Rebuild the forecast customer by customer using expected volume, timing, realized price, and associated compute. The five customers are not necessarily equal-sized, so two out of five does not automatically mean 40% of revenue."
        ],
        [
          "How do you know the RI creates the migration?",
          "I would ask whether the customer's decision or timing changes without the discount and validate that with account teams and a migration plan. Otherwise, some new data could arrive anyway. New customer revenue is not always incremental to the commercial offer."
        ]
      ],
      "watch": "$21M is a forecast after discounts; verify whether it is net of existing-customer compression. Do not claim five migrations are completed or that observed storage-compute correlation proves causation.",
      "checks": [
        "I explained the opportunity cost.",
        "I identified the key customer dependency.",
        "I separated correlation from causation.",
        "I gave the actual prioritization outcome."
      ]
    },
    {
      "id": "cosmos",
      "group": "Core examples",
      "title": "How would you evaluate AI features under a GPU constraint?",
      "story": "Cosmos AI",
      "time": 90,
      "cues": [
        "Native / BYOM / pass-through",
        "Contribution per GPU-hour",
        "Stage the investment"
      ],
      "tests": "Can you evaluate scarce compute without hiding behind a target margin percentage?",
      "answer": [
        [
          "Context",
          "In Cosmos DB, we explored native AI features alongside bring-your-own-model and pass-through alternatives. The decision involved customer experience, market pricing, and constrained GPU capacity."
        ],
        [
          "Framework",
          "I would assess sustainable unit economics at realistic utilization, then compare contribution per constrained GPU-hour with the alternative use of that capacity. I would use a consistent cost definition and include other variable serving costs."
        ],
        [
          "Tradeoff",
          "The native approach had potential advantages in latency and service experience. I would test whether those benefits translated into adoption, retention, or willingness to pay. Aligning with market pricing could reduce arbitrage, but would not establish profitability on its own."
        ],
        [
          "Recommendation approach",
          "I would favor staged investment with explicit demand, utilization, and service-quality gates. I would also assess engineering cost and the time required to reach sustainable economics before committing to a larger native build."
        ]
      ],
      "probes": [
        [
          "What margin hurdle would you use?",
          "I would establish a hurdle consistent with the company's cost definitions, risk, and investment alternatives, then test launch and steady-state utilization. I would not offer a universal percentage or disclose an internal Microsoft target. Compare contribution percentage and contribution per GPU-hour."
        ],
        [
          "A earns $40 contribution in four GPU-hours; B earns $30 in two. Which wins?",

          "How does utilization improve margin?",
          "If capacity costs are fixed over the planning period, serving more paid work with that capacity spreads those costs across more output. That is not guaranteed: rising load may require new capacity or degrade latency. Separate short-run incremental costs from fully loaded long-run economics."

      "watch": "This is an ongoing evaluation plus a proposed decision framework, not a completed launch result. Internal GPU margin targets and the unrelated OneLake 300% growth figure are excluded.",

        "I named the evidence.",
        "I explained the change.",
        "I gave a specific lesson."

    {
      "id": "forecast",
      "group": "Judgment & depth",
      "title": "How would you forecast a consumption-based AI business?",

      "tests": "Can you extend product economics into ongoing financial planning?",
      "answer": [
        [
          "Revenue",
          "I would start with existing customer cohorts and forecast retention, expansion, usage per active customer, and realized price. For new customers, I would model acquisition, activation, and usage ramp separately so that signups do not immediately become mature consumption."
        ],
        [
          "Costs",

        [

        ],

          "Clarify whether the disagreement is about a definition, input, method, or acceptable risk. Reconcile definitions first, inspect the sensitive inputs, and show the decision under both reasonable cases."
        ],

          "Choose a recommendation you can defend: revising scope, including licensing, choosing a commercial model, or setting an overage price. Explain the before and after decision rather than taking credit for all portfolio revenue."

      "watch": "Use exact roles and reactions only if you remember them. Senior approval is context; your contribution is the analysis and recommendation.",
      "checks": [

        "I stated my own ownership.",
        "I explained how to resolve disagreement.",

        "Readiness vs demand",

      "answer": [
        [
          "Expectation",
          "For Fabric SQL, the thesis was that integration and a simpler buying experience would attract Fabric-native developers and support incremental platform usage."
        ],
        [
          "Observation",
          "Usage has been lower than we expected while enterprise capabilities continue to develop. That matters because the financial case depends on new adoption, not only limiting migration from Azure SQL."
        ],
        [
          "Interpretation",
          "Lower usage also means less immediate cannibalization, but I would not use that to declare success. The growth and compression assumptions need to be evaluated separately."
        ],
        [
          "Next step",
          "I would examine where customers stall—readiness requirements, activation, or workload fit—and revise the adoption ramp using that evidence. I would then reassess whether the expected incremental contribution supports the next stage of investment."
        ]
      ],

        [

        "I avoided declaring weak adoption a win.",

        "Net price minus costs",

      "answer": [
        [
          "Definition",
          "I first define the unit and cost scope: a workload, a unit of consumption, or a customer over a given period. I compare realized revenue after discounts and credits with the relevant costs to serve that unit."
        ],
        [
          "Decision context",
          "For a near-term decision with spare paid capacity, incremental contribution can be useful. For a sustained pricing or investment decision, I also need to include the capacity and other costs required to support the business over time."
        ],
        [
          "Application",
          "In an overage decision, I would consider additional billings, serving cost, and any displaced capacity upgrades. In an AI capacity decision, I would also compare contribution per GPU-hour because a high percentage margin does not necessarily use scarce capacity most effectively."
        ],
        [
          "Communication",
          "I would explicitly distinguish contribution dollars from contribution margin percentage, and explain which costs are included so that stakeholders are comparing the same economics."
        ]

      "probes": [
        [
          "Revenue grows from $20M to $24M; variable cost grows from $8M to $10M. What is incremental margin?",
          "Contribution rises from $12M to $14M: an increase of $2M. Incremental contribution margin is $2M divided by the $4M additional revenue, or 50%. The ending contribution margin is $14M divided by $24M, about 58.3%. These are different measures."

          "Can a lower-margin product be the right investment?",
          "Yes, if it creates enough incremental contribution, meets required returns, or has evidenced strategic benefits. Under a capacity constraint, compare contribution per constrained unit and available demand. Do not assume more revenue is always better."
        ],

          "Do you include fixed GPU cost?",
          "That depends on the decision horizon. Already-paid, unavoidable capacity may not be incremental for a short-run choice. Long-run pricing and expansion need a view of replacement or additional capacity cost. State both scopes rather than changing definitions mid-answer."
        ]
      ],
      "watch": "Do not use contribution margin and gross margin interchangeably without confirming cost definitions.",
      "checks": [
        "I defined the unit and cost base.",
        "I distinguished dollars from percentage.",
        "I matched the horizon to the decision.",
        "I considered opportunity cost."

<script>
(() => {
'use strict';
const {questions:qs,agenda,ask,facts}=window.PREP;
const key='alicia-jacob-prep-v1';
let saved={};let storageWorks=true;
try{saved=JSON.parse(localStorage.getItem(key)||'{}');if(!saved||typeof saved!=='object'||Array.isArray(saved))saved={};}catch{saved={};storageWorks=false;}
let view='practice',selected=0,tab='answer',revealed=false,probe=0,probeOpen=false,editing=false;
let remaining=90,running=false,deadline=0,mock=false,phase=0,finished=false;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
const q=()=>qs[selected];
const record=()=>{if(!saved[q().id]||typeof saved[q().id]!=='object')saved[q().id]={};return saved[q().id];};
function persist(){try{localStorage.setItem(key,JSON.stringify(saved));storageWorks=true;}catch{storageWorks=false;toast('Browser storage is unavailable. Edits will last only for this visit.');}}
function toast(t){document.getElementById('status').textContent=t;setTimeout(()=>document.getElementById('status').textContent='',4000);}
function stop(){if(running)remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));running=false;}
function reset(n){stop();remaining=n;}
function toggleTimer(){if(running)stop();else if(remaining>0){deadline=Date.now()+remaining*1000;running=true;}updateTimer();}
function updateTimer(){document.querySelectorAll('[data-clock]').forEach(e=>{e.textContent=fmt(remaining);e.classList.toggle('expired',remaining===0);});document.querySelectorAll('[data-action="timer"]').forEach(e=>{e.textContent=running?'Pause':remaining===0?'Time complete':'Start timer';e.disabled=remaining===0;});}
function choose(i){if(i<0||i>=qs.length)return;selected=i;revealed=false;probe=0;probeOpen=false;editing=false;tab='answer';reset(q().time);render();}
function setPhase(i){phase=i;finished=false;const id=agenda[i][2];const idx=qs.findIndex(x=>x.id===id);if(idx>=0)selected=idx;revealed=false;probe=0;probeOpen=false;editing=false;tab='answer';reset(agenda[i][1]);render();}
function completeCount(){return qs.filter(x=>saved[x.id]?.confidence==='Ready').length;}
function navigation(){return `<header><div class="brand"><div class="monogram" aria-hidden="true">A</div><div><strong>Hiring Manager Studio</strong><small>Alicia · B2B Strategic Finance · Jacob Blau</small></div></div><nav class="nav" aria-label="Main navigation">${[['practice','Practice'],['mock','30-min mock'],['brief','Quick review']].map(([id,t])=>`<button data-view="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${t}</button>`).join('')}</nav></header>`;}
function sidebar(){let prev='';return `<aside aria-label="Practice questions"><div class="side-label">Your preparation</div><div style="padding:0 10px"><strong>${completeCount()} / ${qs.length} ready</strong><div class="progress" role="progressbar" aria-label="Questions marked ready" aria-valuenow="${completeCount()}" aria-valuemin="0" aria-valuemax="${qs.length}"><span style="width:${completeCount()/qs.length*100}%"></span></div></div>${qs.map((x,i)=>{let label=x.group!==prev?`<div class="side-label">${esc(x.group)}</div>`:'';prev=x.group;return label+`<button class="question-link ${selected===i&&view==='practice'?'selected':''}" data-question="${i}"><span class="qnum">${String(i+1).padStart(2,'0')}</span><span>${esc(x.story)}</span>${saved[x.id]?.confidence==='Ready'?'<span class="dot" aria-label="Ready">✓</span>':''}</button>`;}).join('')}<div class="side-foot">Answers, notes, and self-ratings save in this browser only. They do not sync across devices.<br><br>Prepared from your résumé and examples. Practice questions are inferred, not an actual interview script.</div></aside>`;}
function controls(){return `<div class="practice-top"><div><div class="eyebrow">Answer out loud</div><div class="cues">${q().cues.map(c=>`<span class="cue">${esc(c)}</span>`).join('')}</div></div><div class="timer-wrap"><div><div class="timer" data-clock role="timer" aria-label="Time remaining">${fmt(remaining)}</div><div class="timer-label">${mock?'Time for this phase':'Suggested answer time'}</div></div><div class="row"><button class="small" data-action="timer">${running?'Pause':'Start timer'}</button><button class="small" data-action="reset">Reset</button></div></div></div>`;}
function answerPane(){let r=record();if(editing)return `<label class="field" for="answer-edit">Make the answer sound like you</label><textarea id="answer-edit" rows="13">${esc(r.answer||q().answer.map(([h,p])=>h+'\n'+p).join('\n\n'))}</textarea><div class="row"><button class="primary" data-action="save-answer">Save my version</button><button data-action="cancel-edit">Cancel</button></div><p class="save-note">Your version is saved only in this browser. The source answer stays available.</p>`;
if(!revealed)return `<div class="empty"><h2>Make the decision clear.</h2><p>Decision → analysis → recommendation → outcome.<br>Try your answer before opening the example.</p><button class="primary" data-action="reveal">Reveal structured answer</button></div>`;
return `<div class="row spaced"><h2>${r.answer?'Your edited answer':'Your structured answer'}</h2><button class="small" data-action="edit">Edit answer</button></div>${r.answer?`<p style="white-space:pre-wrap">${esc(r.answer)}</p><details><summary>Original structured answer</summary>${blocks()}</details>`:blocks()}<div class="notice"><strong>Keep it defensible.</strong> ${esc(q().watch)}</div><div class="row actions-bottom"><button class="accent" data-action="push">Push me on this</button><button class="small" data-action="hide">Hide answer</button></div>`;}
function blocks(){return q().answer.map(([h,p])=>`<div class="answer-block"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('');}
function pushPane(){const p=q().probes[probe];return `<div class="row spaced"><span class="eyebrow">Follow-up ${probe+1} of ${q().probes.length}</span><span class="pill">${probe===0?'Clarify the logic':probe===1?'Defend the assumption':'Go one level deeper'}</span></div><p class="probe">${esc(p[0])}</p><p class="muted">Answer directly, explain the reasoning, then state what you know or would verify.</p>${probeOpen?`<div class="probe-answer"><strong>How to respond</strong><p>${esc(p[1])}</p></div>`:`<button class="primary" data-action="probe-reveal">Reveal response guidance</button>`}<div class="footer-nav"><button data-action="probe-prev" ${probe===0?'disabled':''}>Previous follow-up</button><button data-action="probe-next" ${probe===q().probes.length-1?'disabled':''}>Next follow-up →</button></div>`;}
function reviewPane(){const r=record();return `<h2>How did that answer land?</h2><p class="muted">Self-review after speaking. These checks do not automatically grade your answer.</p><div class="checklist">${q().checks.map((c,i)=>`<label><input type="checkbox" data-check="${i}" ${r.checks?.[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div><label class="field" for="confidence">How ready do you feel?</label><div class="row" style="margin:10px 0 22px">${['Needs work','Getting there','Ready'].map(c=>`<button data-confidence="${c}" aria-pressed="${r.confidence===c}" class="${r.confidence===c?'accent':''}">${c}</button>`).join('')}</div><label class="field" for="notes">Your phrasing and follow-up notes</label><textarea id="notes" placeholder="What would you say more clearly next time?">${esc(r.notes||'')}</textarea><button class="primary" data-action="save-notes">Save notes</button><p class="save-note">Saved on this browser only. ${storageWorks?'':'Storage is unavailable; keep a separate copy.'}</p>`;}
function questionSurface(){return `<div class="surface">${controls()}<div class="tabs" role="tablist" aria-label="Practice mode">${[['answer','Structured answer'],['push','Push me'],['review','Self-review & notes']].map(([id,t])=>`<button role="tab" aria-selected="${tab===id}" tabindex="${tab===id?'0':'-1'}" id="tab-${id}" aria-controls="panel" data-tab="${id}" class="${tab===id?'active':''}">${t}</button>`).join('')}</div><div style="padding-top:22px" role="tabpanel" id="panel" aria-labelledby="tab-${tab}">${tab==='answer'?answerPane():tab==='push'?pushPane():reviewPane()}</div></div>`;}
function practice(){return `<select class="select-mobile" aria-label="Choose a practice question" id="question-select">${qs.map((x,i)=>`<option value="${i}" ${i===selected?'selected':''}>${i+1}. ${esc(x.story)}</option>`).join('')}</select><div class="topline"><span class="eyebrow">Question ${String(selected+1).padStart(2,'0')} / ${qs.length}</span><span class="pill">${esc(q().story)}</span></div><h1>${esc(q().title)}</h1><p class="intro muted">${esc(q().tests)}</p>${questionSurface()}<div class="footer-nav"><button data-action="prev" ${selected===0?'disabled':''}>← Previous question</button><button data-action="next" ${selected===qs.length-1?'disabled':''}>Next question →</button></div>`;}
function askContent(){return ask.map(([a,b])=>`<div class="answer-block"><h3>Ask Jacob</h3><div><p>${esc(a)}</p><p class="muted" style="font-size:.9rem;margin-top:10px">${esc(b)}</p></div></div>`).join('');}
function mockPage(){if(!mock)return `<div class="eyebrow">Rehearsal</div><h1>A focused 30-minute conversation.</h1><p class="intro muted">A suggested practice agenda. Start each phase's timer, answer out loud, and work through the follow-ups. Advance when you're ready; the app does not record or assess your voice.</p><div class="surface"><h2>Your rehearsal</h2><ol>${agenda.map(([s,t])=>`<li><strong>${t/60} min</strong> · ${esc(s)}</li>`).join('')}</ol><button class="primary" data-action="start-mock">Start the mock interview</button></div>`;
if(finished)return `<div class="eyebrow">Rehearsal complete</div><h1>What would you say more clearly?</h1><div class="surface"><p>Review your notes and rehearse the questions you marked “Needs work.” Focus on the decision, your ownership, and the meaning of each number.</p><div class="row"><button class="primary" data-action="return-practice">Review my answers</button><button data-action="restart-mock">Run another mock</button></div></div>`;
const [name,,id]=agenda[phase];return `<div class="topline"><span class="eyebrow">Phase ${phase+1} / ${agenda.length}</span><button class="small" data-action="end-mock">End rehearsal</button></div><ul class="phase-list" aria-label="Rehearsal phases">${agenda.map(([s],i)=>`<li class="${phase===i?'current':''}">${esc(s)}</li>`).join('')}</ul><h1>${id==='ask'?'What would you like to ask Jacob?':id==='close'?'Close with your fit and interest.':esc(q().title)}</h1>${['ask','close'].includes(id)?`<div class="surface"><div class="row spaced"><div class="timer" data-clock role="timer">${fmt(remaining)}</div><button data-action="timer">${running?'Pause':'Start timer'}</button></div>${id==='ask'?askContent():`<p>“This conversation reinforces my interest. My experience is in turning usage, pricing, and product costs into commercial decisions. I would be excited to bring that foundation to the team's broader product-finance work.”</p><p class="muted">Adapt the close to something you actually learned during the conversation.</p>`}</div>`:questionSurface()}<div class="footer-nav"><span class="muted">${name} · ${agenda[phase][1]/60} minutes allocated</span><button class="primary" data-action="next-phase">${phase===agenda.length-1?'Finish rehearsal':'Next phase →'}</button></div>`;}
function brief(){return `<div class="eyebrow">Before the call</div><h1>Your interview, on one page.</h1><p class="intro muted">Lead with the decision. Use a few numbers you can explain. Leave room for the follow-up.</p><div class="brief-grid" style="margin-top:25px"><section class="surface"><h2>Your positioning</h2><p>You already make financial decisions about B2B products through monetization and product economics. Connect that experience to broader forecasting and investment ownership.</p><p><strong>Answer shape</strong><br>Decision → analysis → recommendation → outcome or uncertainty.</p></section><section class="surface"><h2>Your strongest examples</h2><ul><li><strong>Savings Plan:</strong> growth, discounts, and retention.</li><li><strong>Fabric SQL:</strong> cannibalization and launch judgment.</li><li><strong>Overage:</strong> pricing and customer behavior.</li><li><strong>RI:</strong> investment prioritization.</li><li><strong>Cosmos AI:</strong> constrained compute economics.</li></ul></section><section class="surface full"><h2>Your working numbers</h2><p class="muted">Use these definitions consistently. Open items stay out of the main practice answers.</p><div class="table-wrap"><table><thead><tr><th>Example</th><th>Figure</th><th>Meaning / limit</th></tr></thead><tbody>${facts.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><section class="surface full"><h2>Questions for Jacob</h2>${askContent()}</section><section class="surface"><h2>If you don't have the number</h2><p>“I don't recall the exact figure. The decision was most sensitive to [driver]. I can explain how I modeled it and what would change the recommendation.”</p><p class="muted">Do not fill a memory gap with a new factual claim.</p></section><section class="surface"><h2>Résumé follow-ups to prepare</h2><p>The $500M rejected-feature example needs its original calculation and decision context before it can become a scripted story. The 300% growth claim relates to OneLake, not Cosmos.</p><p>The $14M label and the attribution behind portfolio growth also need precise definitions.</p></section></div>`;}
function render(){app.innerHTML=navigation()+`<div class="layout">${sidebar()}<main id="main">${view==='practice'?practice():view==='mock'?mockPage():brief()}</main></div>`;updateTimer();}
app.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.view){stop();view=el.dataset.view;if(view!=='mock')mock=false;reset(q().time);render();return;}if(el.dataset.question!==undefined){view='practice';mock=false;choose(Number(el.dataset.question));return;}if(el.dataset.tab){tab=el.dataset.tab;editing=false;render();document.getElementById('tab-'+tab)?.focus();return;}if(el.dataset.confidence){record().confidence=el.dataset.confidence;persist();render();return;}const a=el.dataset.action;switch(a){case'timer':toggleTimer();return;case'reset':reset(mock?agenda[phase][1]:q().time);break;case'reveal':revealed=true;break;case'hide':revealed=false;break;case'edit':editing=true;break;case'cancel-edit':editing=false;break;case'save-answer':{const v=document.getElementById('answer-edit').value.trim();if(!v){toast('Add an answer before saving.');return;}record().answer=v;persist();editing=false;toast('Your answer is saved in this browser.');break;}case'push':tab='push';probeOpen=false;break;case'probe-reveal':probeOpen=true;break;case'probe-prev':probe=Math.max(0,probe-1);probeOpen=false;break;case'probe-next':probe=Math.min(q().probes.length-1,probe+1);probeOpen=false;break;case'save-notes':record().notes=document.getElementById('notes').value;persist();toast('Notes saved in this browser.');return;case'prev':choose(selected-1);return;case'next':choose(selected+1);return;case'start-mock':case'restart-mock':mock=true;setPhase(0);return;case'next-phase':if(phase<agenda.length-1){setPhase(phase+1);return;}stop();finished=true;break;case'end-mock':stop();finished=true;break;case'return-practice':mock=false;view='practice';choose(selected);return;}render();});
app.addEventListener('change',e=>{if(e.target.id==='question-select'){choose(Number(e.target.value));return;}if(e.target.dataset.check!==undefined){const r=record();if(!r.checks)r.checks={};r.checks[e.target.dataset.check]=e.target.checked;persist();}});
app.addEventListener('input',e=>{if(e.target.id==='notes'){record().notes=e.target.value;persist();}});
app.addEventListener('keydown',e=>{if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['answer','push','review'];let i=tabs.indexOf(tab);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;tab=tabs[i];editing=false;render();document.getElementById('tab-'+tab).focus();}});
setInterval(()=>{if(!running)return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remaining===0){running=false;toast(mock?'Phase time is complete. Continue when you are ready.':'Time is complete. Finish your main point.');}updateTimer();},250);
render();
const ctx=document.modelContext;if(ctx?.registerTool){try{Promise.resolve(ctx.registerTool({name:'list_practice_questions',description:'List interview practice questions and device-local self-ratings.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({questions:qs.map(x=>({id:x.id,title:x.title,confidence:saved[x.id]?.confidence||'Unrated'}))})})).catch(()=>{});Promise.resolve(ctx.registerTool({name:'open_practice_question',description:'Open a question in the visible practice interface, stop any timer, and hide its answer.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||typeof input.id!=='string'||Object.keys(input).some(k=>k!=='id'))throw Error('Provide a question id.');const i=qs.findIndex(x=>x.id===input.id);if(i<0)throw Error('Unknown question id.');view='practice';mock=false;choose(i);return{id:q().id,title:q().title,answerVisible:false};}})).catch(()=>{});}catch{}}
})();

</script></body></html>
